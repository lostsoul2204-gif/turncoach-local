name: TurnCoach APK bauen

on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'TurnCoach_Quellcode_Handy_v0.1.1.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Quellcode entpacken
        run: |
          mkdir -p android-project
          unzip -q TurnCoach_Quellcode_Handy_v0.1.1.zip -d android-project

      - name: APK bauen
        run: gradle -p android-project :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TurnCoach-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
