name: TurnCoach APK bauen

on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'TurnCoach_Quellcode_Handy_v0.1.1.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Android SDK 36 installieren
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle 8.13 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: TurnCoach-Quellcode entpacken
        run: |
          mkdir -p android-project
          unzip -q TurnCoach_Quellcode_Handy_v0.1.1.zip -d android-project

      - name: Debug-APK bauen
        run: gradle -p android-project :app:assembleDebug --no-daemon --stacktrace

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: TurnCoach-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
